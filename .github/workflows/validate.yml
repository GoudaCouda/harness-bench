name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install controller
        run: python -m pip install -e ".[dev]"

      - name: Check Python source
        run: ruff check src tools docker tests

      - name: Validate active and archived task layout
        run: python tools/task_maintenance/validate_archive_layout.py

      - name: Validate current Standard274 task suite
        run: python tools/task_maintenance/validate_task_suite.py --expected-count 274 --task-set standard274

      - name: Validate task designs
        run: python tools/task_maintenance/validate_design_outlines.py

      - name: Validate public leakage
        run: python tools/task_maintenance/validate_public_leakage.py

      - name: Validate deadline policy
        run: python tools/task_maintenance/deadline_policy.py --check

      - name: Validate generated release metadata
        run: |
          python tools/task_maintenance/build_catalog.py --check

      - name: Verify Standard274 content lock
        run: |
          python tools/task_maintenance/verify_task_set_lock.py \
            --task-set standard274 --lock catalog/standard274.release-v1.lock.json

      - name: Verify Multimodal26 content lock
        run: |
          python tools/task_maintenance/verify_task_set_lock.py \
            --suite-root suites/multimodal26 --task-set multimodal26 \
            --lock catalog/multimodal26.lock.json

      - name: Validate isolation policy
        run: python tools/isolation/validate_isolation_config.py

      - name: Run unit tests
        run: python -m pytest -q

  multimodal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install controller and browser grader runtime
        run: |
          python -m pip install -e ".[dev]" playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Grade multimodal references in the browser
        run: python tools/task_maintenance/validate_multimodal_references.py --require-reference
