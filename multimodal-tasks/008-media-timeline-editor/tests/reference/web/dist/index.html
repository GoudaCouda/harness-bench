<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Timeline</title><style>*{box-sizing:border-box}:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172026;background:#f5f7f8}body{margin:0}button,input,select{font:inherit}h1,h2,h3,p{margin:0}.app-shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#64727a;font-size:.78rem;font-weight:800;text-transform:uppercase}.lead{margin-top:8px;color:#53636b;max-width:780px}h1{font-size:2rem;line-height:1.1}.controls,.metrics,.workspace,.detail-grid{display:grid;gap:12px}.controls{grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px;margin-bottom:16px}.controls label{display:grid;gap:6px;color:#40515b;font-size:.88rem;font-weight:800}button,select,input{min-height:40px;border:1px solid #9cadb6;border-radius:6px;background:#fff;color:#172026;padding:8px 10px}button{cursor:pointer;font-weight:800}button[aria-pressed=true],button.active{background:#e7f1f2;border-color:#225b6d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6f83;outline-offset:2px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.panel,.inspector,.card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px}.metric strong{display:block;font-size:1.45rem;margin-top:4px}.metric span,.fact span{color:#64727a;font-size:.78rem;font-weight:800}.workspace{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.inspector{position:sticky;top:14px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.fact{border:1px solid #e1e8ec;border-radius:6px;padding:10px}.list{display:grid;gap:8px}.muted{color:#5c6a72}.visually-wide{max-width:100%;overflow:hidden}@media(max-width:860px){.controls,.metrics,.workspace{grid-template-columns:1fr}.inspector{position:static}h1{font-size:1.45rem}.app-shell{width:min(100vw - 20px,560px);padding-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.timeline{position:relative;height:300px;background:#111b22;border-radius:8px;padding:20px 20px 20px 96px;overflow:hidden}.track{position:relative;height:78px;border-top:1px solid #53636b}.track-label{position:absolute;left:-76px;top:25px;color:#e9f1f4;font-weight:800}.clip{position:absolute;top:15px;height:42px;border:2px solid #b8d8e4;background:#24576a;color:#fff;border-radius:6px;padding:5px 6px;text-align:left;overflow:hidden}.clip.active{border-color:#fff;background:#7d4e00}.playhead{position:absolute;top:12px;bottom:12px;width:3px;background:#f2c94c;box-shadow:0 0 0 2px rgba(0,0,0,.25)}.trim-band{position:absolute;top:242px;height:24px;background:rgba(242,201,76,.28);border:1px solid #f2c94c;border-radius:5px}.transport{display:flex;gap:8px;flex-wrap:wrap}.timeline small{display:block;font-size:.68rem}.inspector pre{white-space:pre-wrap;background:#eef3f5;border-radius:6px;padding:8px}@media(max-width:860px){.timeline{height:360px;padding-left:80px}.track{height:96px}.track-label{left:-66px}}</style></head><body><div id="root"></div><script>
const clips=[{"id": "CLIP-INTRO", "title": "Opening bumper", "track": "Video", "start": 0, "duration": 12, "owner": "Mara", "status": "locked"}, {"id": "CLIP-BROLL", "title": "Kitchen b-roll", "track": "Video", "start": 18, "duration": 28, "owner": "Noel", "status": "review"}, {"id": "CLIP-VO", "title": "Narration take", "track": "Audio", "start": 8, "duration": 42, "owner": "Priya", "status": "review"}, {"id": "CLIP-MUSIC", "title": "Ambient loop", "track": "Audio", "start": 52, "duration": 30, "owner": "Priya", "status": "clear"}, {"id": "CLIP-CTA", "title": "End card", "track": "Graphics", "start": 78, "duration": 14, "owner": "Mara", "status": "clear"}, {"id": "CLIP-LOWER", "title": "Speaker lower third", "track": "Graphics", "start": 24, "duration": 18, "owner": "Noel", "status": "watch"}]; const tracks=['Video','Audio','Graphics']; let selectedId='CLIP-BROLL', currentTime=20, trimIn=18, trimOut=46, playing=false; const root=document.getElementById('root');
function render(){ const selected=clips.find(c=>c.id===selectedId)||clips[0]; const review=clips.filter(c=>c.status!=='clear'); const trimLength=Math.max(0,trimOut-trimIn); const selectedTrackSeconds=clips.filter(c=>c.track===selected.track).reduce((s,c)=>s+c.duration,0); root.innerHTML=`<main class="app-shell" aria-label="Timeline seek trim editor"><header class="topbar"><div><p class="eyebrow">Media timeline</p><h1>Timeline seek and trim editor</h1><p class="lead">Scrub the playhead, select clip blocks, and set trim in/out on protected local clip records.</p></div></header><section class="controls" aria-label="Transport and trim controls"><button type="button" id="play" aria-pressed="${playing}">${playing?'Pause':'Play'}</button><label>Current time<input id="time" aria-label="Current time" type="range" min="0" max="100" value="${currentTime}"/></label><button type="button" id="trimIn">Set trim in</button><button type="button" id="trimOut">Set trim out</button></section><section class="metrics" aria-label="Timeline metrics"><article class="metric"><span>Current time</span><strong>${currentTime}s</strong><small>Playhead position</small></article><article class="metric"><span>Trim range</span><strong>${trimIn}-${trimOut}s</strong><small>${trimLength}s selected</small></article><article class="metric"><span>Selected clip</span><strong>${selected.id}</strong><small>${selected.title}</small></article><article class="metric"><span>Review clips</span><strong>${review.length}</strong><small>Non-clear items</small></article></section><section class="workspace"><section class="panel"><p class="eyebrow">Editable timeline</p><div class="timeline" data-testid="timeline-board">${tracks.map(track=>`<div class="track" aria-label="${track} track"><span class="track-label">${track}</span>${clips.filter(c=>c.track===track).map(c=>`<button type="button" class="clip ${c.id===selectedId?'active':''}" data-clip-id="${c.id}" style="left:${c.start}%;width:${c.duration}%;"><strong>${c.id}</strong><small>${c.title}</small></button>`).join('')}</div>`).join('')}<div class="trim-band" data-testid="trim-band" style="left:${trimIn}%;width:${trimLength}%"></div><div class="playhead" data-testid="playhead" style="left:${currentTime}%"></div></div></section><aside class="inspector" aria-live="polite" aria-label="Selected clip detail"><p class="eyebrow">Selected clip detail</p><h2>${selected.id} - ${selected.title}</h2><div class="detail-grid"><div class="fact"><span>Track</span><strong>${selected.track}</strong></div><div class="fact"><span>Owner</span><strong>${selected.owner}</strong></div><div class="fact"><span>Start</span><strong>${selected.start}</strong></div><div class="fact"><span>Duration</span><strong>${selected.duration}</strong></div></div><pre>${selected.id} trim ${trimIn} to ${trimOut}; ${selectedTrackSeconds} seconds on ${selected.track}</pre></aside></section></main>`; document.getElementById('play').onclick=()=>{playing=!playing;render();}; document.getElementById('time').oninput=e=>{currentTime=Number(e.target.value);render();}; document.getElementById('trimIn').onclick=()=>{trimIn=currentTime;render();}; document.getElementById('trimOut').onclick=()=>{trimOut=currentTime;render();}; document.querySelectorAll('[data-clip-id]').forEach(btn=>btn.onclick=()=>{selectedId=btn.getAttribute('data-clip-id');render();}); } render();
</script></body></html>
