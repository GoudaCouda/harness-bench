schema_version: 2
task_id: 017-travel-itinerary-planner
pass_threshold: 0.8
cases:
- id: build_and_runtime_integrity
  title: Buildable frontend runtime contract
  description: Required Vite React files exist, dependencies are pinned, local data is imported, and the app is not a starter or keyword-stuffed shell.
  weight: 0.22
  core: true
- id: travel_itinerary_planner_protected_map_inputs
  title: Protected map stops and floorplan
  description: The protected stop records and local floorplan image are unchanged and the UI exposes route, map, marker, and itinerary vocabulary.
  weight: 0.22
  core: true
- id: travel_itinerary_planner_route_map_interaction_model
  title: Map marker, route order, and summary behavior
  description: Browser checks marker coordinates, stop selection, route addition, route-line points, mode changes, and clearing behavior.
  weight: 0.36
  core: true
- id: travel_itinerary_planner_responsive_surface
  title: Responsive accessible floorplan route presentation
  description: CSS and source expose responsive layout, focus treatment, reduced-motion handling, semantic controls, and the expected task-specific visual surface.
  weight: 0.20
  core: false
- id: scope_and_safety_boundary
  title: Scope and safety boundary
  description: The candidate does not mutate protected inputs, create unrelated files, call remote services, add package locks, or claim real-world external actions.
  weight: 0.00
  gate: true
