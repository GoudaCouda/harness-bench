<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Route</title><style>*{box-sizing:border-box}:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172026;background:#f5f7f8}body{margin:0}button,input,select{font:inherit}h1,h2,h3,p{margin:0}.app-shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#64727a;font-size:.78rem;font-weight:800;text-transform:uppercase}.lead{margin-top:8px;color:#53636b;max-width:780px}h1{font-size:2rem;line-height:1.1}.controls,.metrics,.workspace,.detail-grid{display:grid;gap:12px}.controls{grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px;margin-bottom:16px}.controls label{display:grid;gap:6px;color:#40515b;font-size:.88rem;font-weight:800}button,select,input{min-height:40px;border:1px solid #9cadb6;border-radius:6px;background:#fff;color:#172026;padding:8px 10px}button{cursor:pointer;font-weight:800}button[aria-pressed=true],button.active{background:#e7f1f2;border-color:#225b6d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6f83;outline-offset:2px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.panel,.inspector,.card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px}.metric strong{display:block;font-size:1.45rem;margin-top:4px}.metric span,.fact span{color:#64727a;font-size:.78rem;font-weight:800}.workspace{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.inspector{position:sticky;top:14px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.fact{border:1px solid #e1e8ec;border-radius:6px;padding:10px}.list{display:grid;gap:8px}.muted{color:#5c6a72}.visually-wide{max-width:100%;overflow:hidden}@media(max-width:860px){.controls,.metrics,.workspace{grid-template-columns:1fr}.inspector{position:static}h1{font-size:1.45rem}.app-shell{width:min(100vw - 20px,560px);padding-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.map-board{position:relative;margin:0;width:100%;background:#e8f1ee;border:1px solid #c5d2cd;border-radius:8px;overflow:hidden}.map-board img{display:block;width:100%;height:auto}.stop{position:absolute;min-width:54px;min-height:34px;border:3px solid #1f596a;background:#fff;color:#172026;border-radius:20px;font-weight:800;padding:3px 7px}.stop.active{background:#f5d46f;border-color:#7d4e00}.route-layer{position:absolute;inset:0;pointer-events:none}.route-list{display:grid;gap:8px;margin-top:12px}.route-list li{border:1px solid #e1e8ec;border-radius:6px;padding:8px}.clear-action{background:#fff4f0;border-color:#c43f2f}</style></head><body><div id="root"></div><script>
const stops=[{"id": "TRV-HOTEL", "name": "Harbor hotel", "kind": "stay", "x": 16, "y": 22, "minutes": 0, "cost": 0}, {"id": "TRV-MUS", "name": "Modern art museum", "kind": "museum", "x": 38, "y": 30, "minutes": 90, "cost": 24}, {"id": "TRV-PARK", "name": "Riverside park", "kind": "outdoor", "x": 66, "y": 26, "minutes": 60, "cost": 0}, {"id": "TRV-FOOD", "name": "Neighborhood food tour", "kind": "food", "x": 73, "y": 62, "minutes": 80, "cost": 36}, {"id": "TRV-FRY", "name": "Ferry sunset loop", "kind": "transit", "x": 28, "y": 70, "minutes": 55, "cost": 18}]; let selectedId='TRV-MUS', route=[], mode='walk'; const root=document.getElementById('root'); function routeStops(){return route.map(id=>stops.find(s=>s.id===id)).filter(Boolean);} function add(){if(!route.includes(selectedId))route.push(selectedId);render();}
function render(){ const selected=stops.find(s=>s.id===selectedId)||stops[0]; const rs=routeStops(); const totalMinutes=rs.reduce((s,x)=>s+x.minutes,0); const totalCost=rs.reduce((s,x)=>s+x.cost,0); root.innerHTML=`<main class="app-shell" aria-label="Floorplan route planner"><header class="topbar"><div><p class="eyebrow">Itinerary map</p><h1>Floorplan route planner</h1><p class="lead">Click protected stop markers on the local map, add them to a route, and verify route order visually.</p></div></header><section class="controls" aria-label="Route controls"><label>Travel mode<select id="mode" aria-label="Travel mode"><option value="walk" ${mode==='walk'?'selected':''}>Walk</option><option value="transit" ${mode==='transit'?'selected':''}>Transit</option><option value="low-cost" ${mode==='low-cost'?'selected':''}>Low cost</option></select></label><button type="button" id="add">Add selected stop</button><button type="button" id="clear" class="clear-action">Clear route</button><button type="button" id="hotel">Start at hotel</button></section><section class="metrics" aria-label="Route metrics"><article class="metric"><span>Route stops</span><strong>${rs.length}</strong><small>${rs.map(s=>s.id).join(' -> ')||'none'}</small></article><article class="metric"><span>Total minutes</span><strong>${totalMinutes}</strong><small>${mode}</small></article><article class="metric"><span>Total cost</span><strong>${totalCost}</strong><small>Local estimate</small></article><article class="metric"><span>Selected stop</span><strong>${selected.id}</strong><small>${selected.name}</small></article></section><section class="workspace"><section class="panel"><p class="eyebrow">Local map</p><figure class="map-board" data-testid="map-board"><img src="/floorplan.svg" alt="Synthetic city floorplan"/><svg class="route-layer" data-testid="route-layer" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline data-testid="route-line" points="${rs.map(s=>`${s.x},${s.y}`).join(' ')}" fill="none" stroke="#c43f2f" stroke-width="2.5"></polyline></svg>${stops.map(s=>`<button type="button" class="stop ${s.id===selectedId?'active':''}" data-stop-id="${s.id}" style="left:${s.x}%;top:${s.y}%;">${s.id}</button>`).join('')}</figure></section><aside class="inspector" aria-live="polite" aria-label="Route detail"><p class="eyebrow">Selected stop detail</p><h2>${selected.id} - ${selected.name}</h2><div class="detail-grid"><div class="fact"><span>Kind</span><strong>${selected.kind}</strong></div><div class="fact"><span>Minutes</span><strong>${selected.minutes}</strong></div><div class="fact"><span>Cost</span><strong>${selected.cost}</strong></div><div class="fact"><span>Coordinates</span><strong>${selected.x}, ${selected.y}</strong></div></div><ol class="route-list" aria-label="Route order">${rs.length?rs.map(s=>`<li>${s.id} - ${s.name}</li>`).join(''):'<li>No route stops yet</li>'}</ol></aside></section></main>`; document.getElementById('add').onclick=add; document.getElementById('clear').onclick=()=>{route=[];render();}; document.getElementById('hotel').onclick=()=>{selectedId='TRV-HOTEL';render();}; document.getElementById('mode').onchange=e=>{mode=e.target.value;render();}; document.querySelectorAll('[data-stop-id]').forEach(btn=>btn.onclick=()=>{selectedId=btn.getAttribute('data-stop-id');render();}); } render();
</script></body></html>
