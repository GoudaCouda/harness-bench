<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Responsive</title><style>*{box-sizing:border-box}:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172026;background:#f5f7f8}body{margin:0}button,input,select{font:inherit}h1,h2,h3,p{margin:0}.app-shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#64727a;font-size:.78rem;font-weight:800;text-transform:uppercase}.lead{margin-top:8px;color:#53636b;max-width:780px}h1{font-size:2rem;line-height:1.1}.controls,.metrics,.workspace,.detail-grid{display:grid;gap:12px}.controls{grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px;margin-bottom:16px}.controls label{display:grid;gap:6px;color:#40515b;font-size:.88rem;font-weight:800}button,select,input{min-height:40px;border:1px solid #9cadb6;border-radius:6px;background:#fff;color:#172026;padding:8px 10px}button{cursor:pointer;font-weight:800}button[aria-pressed=true],button.active{background:#e7f1f2;border-color:#225b6d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6f83;outline-offset:2px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.panel,.inspector,.card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px}.metric strong{display:block;font-size:1.45rem;margin-top:4px}.metric span,.fact span{color:#64727a;font-size:.78rem;font-weight:800}.workspace{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.inspector{position:sticky;top:14px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.fact{border:1px solid #e1e8ec;border-radius:6px;padding:10px}.list{display:grid;gap:8px}.muted{color:#5c6a72}.visually-wide{max-width:100%;overflow:hidden}@media(max-width:860px){.controls,.metrics,.workspace{grid-template-columns:1fr}.inspector{position:static}h1{font-size:1.45rem}.app-shell{width:min(calc(100vw - 20px),560px);padding-top:14px}.device-frame{width:100%!important}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.frame-wrap{overflow:auto;background:#dce5ea;border:1px solid #c1ccd2;border-radius:8px;padding:18px}.device-frame{position:relative;margin:0 auto;background:#fff;border:3px solid #1b2b34;border-radius:16px;overflow:hidden;max-width:100%}.device-frame img{display:block;width:100%;height:auto}.marker{position:absolute;border:3px solid #c43f2f;background:rgba(196,63,47,.15);color:#172026;padding:3px 5px;text-align:left}.marker strong{font-size:.7rem;background:#fff;border:1px solid currentColor;border-radius:4px;padding:1px 3px}.marker.active{border-color:#185b70;background:rgba(24,91,112,.16)}.hidden-marker{display:none}.inspector code{display:block;background:#eef3f5;border-radius:6px;padding:8px;margin-top:10px}</style></head><body><div id="root"></div><script>
const issues=[{"id": "RESP-NAV", "label": "Nav wraps into logo", "area": "header", "x": 58, "y": 8, "w": 30, "h": 12, "severity": "review"}, {"id": "RESP-CTA", "label": "CTA overflows card", "area": "pricing", "x": 60, "y": 61, "w": 28, "h": 12, "severity": "review"}, {"id": "RESP-HERO", "label": "Hero copy crowding", "area": "hero", "x": 8, "y": 24, "w": 42, "h": 20, "severity": "watch"}, {"id": "RESP-FAQ", "label": "FAQ accordion cramped", "area": "support", "x": 10, "y": 78, "w": 78, "h": 12, "severity": "watch"}]; const presets={desktop:900,tablet:680,mobile:390}; let device='desktop', width=900, showOverflow=true, selectedId='RESP-NAV'; const root=document.getElementById('root');
function render(){ const selected=issues.find(i=>i.id===selectedId)||issues[0]; const activeWidth=device==='desktop'?width:presets[device]; const visible=showOverflow?issues:issues.filter(i=>i.severity==='review'); const reviewCount=visible.filter(i=>i.severity==='review').length; const markerArea=Math.round(visible.reduce((s,i)=>s+i.w*i.h,0)); root.innerHTML=`<main class="app-shell" aria-label="Responsive visual inspector"><header class="topbar"><div><p class="eyebrow">Responsive review</p><h1>Viewport overflow inspector</h1><p class="lead">Resize a local page preview and inspect protected overflow markers tied to exact visual regions.</p></div></header><section class="controls" aria-label="Responsive inspector controls"><label>Device preset<select id="device" aria-label="Device preset"><option value="desktop" ${device==='desktop'?'selected':''}>Desktop</option><option value="tablet" ${device==='tablet'?'selected':''}>Tablet</option><option value="mobile" ${device==='mobile'?'selected':''}>Mobile</option></select></label><label>Viewport width<input id="width" aria-label="Viewport width" type="range" min="320" max="900" value="${width}"/></label><button type="button" id="toggle" aria-pressed="${showOverflow}">Show overflow markers</button><button type="button" id="snap">Snap to 390</button></section><section class="metrics" aria-label="Responsive metrics"><article class="metric"><span>Viewport width</span><strong>${activeWidth}</strong><small>${device}</small></article><article class="metric"><span>Overflow markers</span><strong>${visible.length}</strong><small>Visible issues</small></article><article class="metric"><span>Review breakpoints</span><strong>${reviewCount}</strong><small>Review severity</small></article><article class="metric"><span>Marked area</span><strong>${markerArea}</strong><small>Percent grid units</small></article></section><section class="workspace"><section class="panel"><p class="eyebrow">Device frame</p><div class="frame-wrap"><figure class="device-frame" data-testid="responsive-frame" style="width:${activeWidth}px"><img src="/responsive-target.svg" alt="Synthetic responsive product page"/>${visible.map(i=>`<button type="button" class="marker ${i.id===selectedId?'active':''}" data-issue-id="${i.id}" style="left:${i.x}%;top:${i.y}%;width:${i.w}%;height:${i.h}%;"><strong>${i.id}</strong></button>`).join('')}</figure></div></section><aside class="inspector" aria-live="polite" aria-label="Responsive issue detail"><p class="eyebrow">Issue detail</p><h2>${selected.id} - ${selected.label}</h2><div class="detail-grid"><div class="fact"><span>Area</span><strong>${selected.area}</strong></div><div class="fact"><span>Severity</span><strong>${selected.severity}</strong></div><div class="fact"><span>Coordinates</span><strong>${selected.x}, ${selected.y}</strong></div><div class="fact"><span>Frame</span><strong>${activeWidth}</strong></div></div><code>${selected.id} breakpoint marker at ${selected.x}/${selected.y}</code></aside></section></main>`; document.getElementById('device').onchange=e=>{device=e.target.value;render();}; document.getElementById('width').oninput=e=>{width=Number(e.target.value);render();}; document.getElementById('toggle').onclick=()=>{showOverflow=!showOverflow;render();}; document.getElementById('snap').onclick=()=>{width=390;device='desktop';render();}; document.querySelectorAll('[data-issue-id]').forEach(btn=>btn.onclick=()=>{selectedId=btn.getAttribute('data-issue-id');render();}); } render();
</script></body></html>
