schema_version: 2
task_id: 009-course-builder-app
pass_threshold: 0.8
cases:
- id: build_and_runtime_integrity
  title: Buildable frontend runtime contract
  description: Required Vite React files exist, dependencies are pinned, local data is imported, and the app is not a starter or keyword-stuffed shell.
  weight: 0.22
  core: true
- id: course_builder_app_protected_lessons
  title: Protected lesson wizard data
  description: The protected lesson data is unchanged and the UI exposes wizard, lesson, prerequisite, and review vocabulary.
  weight: 0.22
  core: true
- id: course_builder_app_wizard_interaction_model
  title: Wizard gating, prerequisites, and review behavior
  description: Browser checks disabled step gating, lesson selection, prerequisite error state, Include prerequisites, and final summary.
  weight: 0.36
  core: true
- id: course_builder_app_responsive_surface
  title: Responsive accessible course wizard presentation
  description: CSS and source expose responsive layout, focus treatment, reduced-motion handling, semantic controls, and the expected task-specific visual surface.
  weight: 0.20
  core: false
- id: scope_and_safety_boundary
  title: Scope and safety boundary
  description: The candidate does not mutate protected inputs, create unrelated files, call remote services, add package locks, or claim real-world external actions.
  weight: 0.00
  gate: true
