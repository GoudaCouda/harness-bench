<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Wizard</title><style>*{box-sizing:border-box}:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172026;background:#f5f7f8}body{margin:0}button,input,select{font:inherit}h1,h2,h3,p{margin:0}.app-shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#64727a;font-size:.78rem;font-weight:800;text-transform:uppercase}.lead{margin-top:8px;color:#53636b;max-width:780px}h1{font-size:2rem;line-height:1.1}.controls,.metrics,.workspace,.detail-grid{display:grid;gap:12px}.controls{grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px;margin-bottom:16px}.controls label{display:grid;gap:6px;color:#40515b;font-size:.88rem;font-weight:800}button,select,input{min-height:40px;border:1px solid #9cadb6;border-radius:6px;background:#fff;color:#172026;padding:8px 10px}button{cursor:pointer;font-weight:800}button[aria-pressed=true],button.active{background:#e7f1f2;border-color:#225b6d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6f83;outline-offset:2px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.panel,.inspector,.card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px}.metric strong{display:block;font-size:1.45rem;margin-top:4px}.metric span,.fact span{color:#64727a;font-size:.78rem;font-weight:800}.workspace{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.inspector{position:sticky;top:14px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.fact{border:1px solid #e1e8ec;border-radius:6px;padding:10px}.list{display:grid;gap:8px}.muted{color:#5c6a72}.visually-wide{max-width:100%;overflow:hidden}@media(max-width:860px){.controls,.metrics,.workspace{grid-template-columns:1fr}.inspector{position:static}h1{font-size:1.45rem}.app-shell{width:min(100vw - 20px,560px);padding-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}.step{border:1px solid #cfd8dd;border-radius:8px;background:#fff;padding:10px}.step.active{border-color:#205a6d;background:#e8f2f3}.wizard-card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:18px;min-height:320px}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lesson{display:grid;gap:4px;text-align:left}.lesson.selected{background:#e8f2f3;border-color:#205a6d}.error{color:#9b2d20;font-weight:800}.review-box{background:#eef3f5;border-radius:6px;padding:12px;margin-top:12px}@media(max-width:760px){.steps,.lesson-grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>
const lessons=[{"id": "LESS-GOAL", "title": "Set learning goal", "module": "Plan", "minutes": 15, "level": "intro", "prereq": "none"}, {"id": "LESS-DATA", "title": "Import dataset", "module": "Prepare", "minutes": 35, "level": "intro", "prereq": "LESS-GOAL"}, {"id": "LESS-LAB", "title": "Hands-on model lab", "module": "Build", "minutes": 50, "level": "core", "prereq": "LESS-DATA"}, {"id": "LESS-QUIZ", "title": "Checkpoint quiz", "module": "Assess", "minutes": 20, "level": "core", "prereq": "LESS-LAB"}, {"id": "LESS-CAP", "title": "Capstone brief", "module": "Assess", "minutes": 45, "level": "advanced", "prereq": "LESS-QUIZ"}]; const steps=['Audience','Lessons','Prerequisites','Review']; let step=0,audience='',selectedLessons=[],includePrereqs=false; const root=document.getElementById('root');
function selected(){return lessons.filter(l=>selectedLessons.includes(l.id));} function missing(){return selected().filter(l=>l.prereq!=='none'&&!selectedLessons.includes(l.prereq));} function canNext(){return step===0?audience!=='':step===1?selectedLessons.length>0:step===2?includePrereqs||missing().length===0:true;} function total(){return selected().reduce((s,l)=>s+l.minutes,0);} function toggle(id){selectedLessons=selectedLessons.includes(id)?selectedLessons.filter(x=>x!==id):[...selectedLessons,id]; render();}
function render(){ const sel=selected(), miss=missing(), ok=canNext(); let panel=''; if(step===0) panel=`<div><h2>Audience</h2><label>Audience<select id="audience" aria-label="Audience"><option value="">Choose audience</option><option value="analysts" ${audience==='analysts'?'selected':''}>Analysts</option><option value="managers" ${audience==='managers'?'selected':''}>Managers</option><option value="students" ${audience==='students'?'selected':''}>Students</option></select></label>${!audience?'<p class="error">Choose an audience before continuing.</p>':''}</div>`; if(step===1) panel=`<div><h2>Lessons</h2><div class="lesson-grid">${lessons.map(l=>`<button type="button" class="lesson ${selectedLessons.includes(l.id)?'selected':''}" data-lesson-id="${l.id}"><strong>${l.id} - ${l.title}</strong><small>${l.module} / ${l.minutes} minutes / prereq ${l.prereq}</small></button>`).join('')}</div></div>`; if(step===2) panel=`<div><h2>Prerequisites</h2><label><input type="checkbox" id="prereq" aria-label="Include prerequisites" ${includePrereqs?'checked':''}/> Include prerequisites</label>${miss.length&&!includePrereqs?`<p class="error">Resolve prerequisite gaps: ${miss.map(l=>`${l.id} needs ${l.prereq}`).join(', ')}</p>`:''}<p>Prerequisite map includes ${lessons.map(l=>l.prereq).join(' / ')}.</p></div>`; if(step===3) panel=`<div><h2>Review summary</h2><div class="review-box">Audience ${audience}; lessons ${sel.map(l=>l.id).join(' / ')}; total ${total()} minutes; prerequisites ${includePrereqs?'included':'manual'}.</div></div>`; root.innerHTML=`<main class="app-shell" aria-label="Course setup wizard"><header class="topbar"><div><p class="eyebrow">Curriculum wizard</p><h1>Multi-step course builder</h1><p class="lead">Choose an audience, assemble lessons, resolve prerequisites, then review the generated outline.</p></div></header><section class="steps" aria-label="Wizard progress">${steps.map((name,i)=>`<article class="step ${i===step?'active':''}"><strong>Step ${i+1} of 4</strong><p>${name}</p></article>`).join('')}</section><section class="metrics" aria-label="Course wizard metrics"><article class="metric"><span>Selected lessons</span><strong>${sel.length}</strong><small>${sel.map(l=>l.id).join(' / ')||'none'}</small></article><article class="metric"><span>Total minutes</span><strong>${total()}</strong><small>Planned duration</small></article><article class="metric"><span>Prerequisite gaps</span><strong>${miss.length}</strong><small>${includePrereqs?'auto-resolved':'needs review'}</small></article><article class="metric"><span>Review status</span><strong>${ok?'Ready':'Blocked'}</strong><small>${audience||'No audience'}</small></article></section><section class="workspace"><section class="wizard-card" aria-live="polite" aria-label="Wizard step panel">${panel}<div class="transport"><button type="button" id="back">Back</button><button type="button" id="next" ${!ok?'disabled':''}>Next</button></div></section><aside class="inspector" aria-label="Lesson detail"><p class="eyebrow">Protected lessons</p>${lessons.map(l=>`<p>${l.id} - ${l.title}</p>`).join('')}</aside></section></main>`; const aud=document.getElementById('audience'); if(aud) aud.onchange=e=>{audience=e.target.value; render();}; const pre=document.getElementById('prereq'); if(pre) pre.onchange=e=>{includePrereqs=e.target.checked; render();}; document.getElementById('back').onclick=()=>{step=Math.max(0,step-1);render();}; document.getElementById('next').onclick=()=>{if(canNext()){step=Math.min(3,step+1);render();}}; document.querySelectorAll('[data-lesson-id]').forEach(btn=>btn.onclick=()=>toggle(btn.getAttribute('data-lesson-id'))); } render();
</script></body></html>
