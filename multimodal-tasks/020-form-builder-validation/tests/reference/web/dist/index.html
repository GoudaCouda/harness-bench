<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Form</title><style>*{box-sizing:border-box}:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172026;background:#f5f7f8}body{margin:0}button,input,select{font:inherit}h1,h2,h3,p{margin:0}.app-shell{width:min(1240px,calc(100vw - 32px));margin:0 auto;padding:24px 0 42px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.eyebrow{color:#64727a;font-size:.78rem;font-weight:800;text-transform:uppercase}.lead{margin-top:8px;color:#53636b;max-width:780px}h1{font-size:2rem;line-height:1.1}.controls,.metrics,.workspace,.detail-grid{display:grid;gap:12px}.controls{grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px;margin-bottom:16px}.controls label{display:grid;gap:6px;color:#40515b;font-size:.88rem;font-weight:800}button,select,input{min-height:40px;border:1px solid #9cadb6;border-radius:6px;background:#fff;color:#172026;padding:8px 10px}button{cursor:pointer;font-weight:800}button[aria-pressed=true],button.active{background:#e7f1f2;border-color:#225b6d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2f6f83;outline-offset:2px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.panel,.inspector,.card{background:#fff;border:1px solid #d8e0e5;border-radius:8px;padding:14px}.metric strong{display:block;font-size:1.45rem;margin-top:4px}.metric span,.fact span{color:#64727a;font-size:.78rem;font-weight:800}.workspace{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.inspector{position:sticky;top:14px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.fact{border:1px solid #e1e8ec;border-radius:6px;padding:10px}.list{display:grid;gap:8px}.muted{color:#5c6a72}.visually-wide{max-width:100%;overflow:hidden}@media(max-width:860px){.controls,.metrics,.workspace{grid-template-columns:1fr}.inspector{position:static}h1{font-size:1.45rem}.app-shell{width:min(100vw - 20px,560px);padding-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.palette,.preview{display:grid;gap:8px}.field-button{text-align:left;display:grid;gap:4px}.field-button.active,.field-row.active{background:#e8f2f3;border-color:#205a6d}.field-row{border:1px solid #d8e0e5;border-radius:8px;padding:10px;background:#fff;display:grid;gap:6px}.field-row label{display:grid;gap:5px}.schema{white-space:pre-wrap;background:#172026;color:#eef8fb;border-radius:8px;padding:12px;max-height:260px;overflow:auto}.error{color:#9b2d20;font-weight:800}.valid{color:#2c6532;font-weight:800}.builder-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}@media(max-width:860px){.builder-grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>
const fields=[{"id": "FORM-NAME", "label": "Applicant name", "type": "text", "group": "identity", "required": true, "pattern": "nonempty"}, {"id": "FORM-EMAIL", "label": "Contact email", "type": "email", "group": "contact", "required": true, "pattern": "email"}, {"id": "FORM-PHONE", "label": "Phone number", "type": "tel", "group": "contact", "required": false, "pattern": "phone"}, {"id": "FORM-BUDGET", "label": "Budget range", "type": "number", "group": "project", "required": false, "pattern": "number"}, {"id": "FORM-CONSENT", "label": "Consent checkbox", "type": "checkbox", "group": "legal", "required": true, "pattern": "checked"}]; let selectedId='FORM-EMAIL', added=[], requiredOverrides={}, values={}; const root=document.getElementById('root'); function validate(f,v,req){if(req&&!v)return `${f.id} is required`; if(f.pattern==='email'&&v&&!v.includes('@'))return `Invalid email for ${f.id}`; if(f.pattern==='phone'&&v&&!/^[-0-9 ]+$/.test(v))return `Invalid phone for ${f.id}`; if(f.pattern==='number'&&v&&Number.isNaN(Number(v)))return `Invalid number for ${f.id}`; if(f.pattern==='checked'&&req&&v!=='checked')return `${f.id} must be checked`; return '';} function addedFields(){return added.map(id=>fields.find(f=>f.id===id)).filter(Boolean);} function add(){if(!added.includes(selectedId))added.push(selectedId);render();} function moveUp(){const i=added.indexOf(selectedId); if(i>0){const t=added[i-1]; added[i-1]=added[i]; added[i]=t;} render();}
function render(){ const selected=fields.find(f=>f.id===selectedId)||fields[0]; const af=addedFields(); const errors=af.map(f=>validate(f,values[f.id]||'',requiredOverrides[f.id]??f.required)).filter(Boolean); const schema={fields:af.map(f=>({id:f.id,type:f.type,required:requiredOverrides[f.id]??f.required}))}; root.innerHTML=`<main class="app-shell" aria-label="Form builder validation workspace"><header class="topbar"><div><p class="eyebrow">Form builder</p><h1>Live validation form builder</h1><p class="lead">Add protected fields to the preview, edit sample values, toggle required state, reorder fields, and inspect generated schema.</p></div></header><section class="controls" aria-label="Builder controls"><button type="button" id="add">Add selected field</button><button type="button" id="up">Move field up</button><label><input type="checkbox" id="req" aria-label="Required field" ${(requiredOverrides[selected.id]??selected.required)?'checked':''}/> Required field</label><button type="button" id="clear">Clear form</button></section><section class="metrics" aria-label="Validation metrics"><article class="metric"><span>Field count</span><strong>${af.length}</strong><small>${added.join(' / ')||'none'}</small></article><article class="metric"><span>Required fields</span><strong>${af.filter(f=>requiredOverrides[f.id]??f.required).length}</strong><small>Current schema</small></article><article class="metric"><span>Validation errors</span><strong>${errors.length}</strong><small>${errors[0]||'No errors'}</small></article><article class="metric"><span>Selected field</span><strong>${selected.id}</strong><small>${selected.label}</small></article></section><section class="workspace"><section class="builder-grid"><section class="panel"><p class="eyebrow">Field palette</p><div class="palette">${fields.map(f=>`<button type="button" class="field-button ${f.id===selectedId?'active':''}" data-field-id="${f.id}"><strong>${f.id} - ${f.label}</strong><small>${f.group} / ${f.type} / ${f.pattern}</small></button>`).join('')}</div></section><section class="panel"><p class="eyebrow">Form preview</p><div class="preview" aria-label="Form preview">${af.map(f=>{ const req=requiredOverrides[f.id]??f.required; const error=validate(f,values[f.id]||'',req); return `<div class="field-row ${f.id===selectedId?'active':''}" data-preview-field-id="${f.id}"><label>${f.id} - ${f.label}<input aria-label="${f.id} sample value" type="${f.type==='checkbox'?'text':f.type}" value="${values[f.id]||''}" placeholder="${req?'required':'optional'}"/></label>${error?`<p class="error">${error}</p>`:'<p class="valid">Valid</p>'}</div>`; }).join('')}</div></section></section><aside class="inspector" aria-live="polite" aria-label="Schema preview"><p class="eyebrow">Schema preview</p><h2>${selected.id} - ${selected.label}</h2><div class="detail-grid"><div class="fact"><span>Group</span><strong>${selected.group}</strong></div><div class="fact"><span>Type</span><strong>${selected.type}</strong></div><div class="fact"><span>Pattern</span><strong>${selected.pattern}</strong></div><div class="fact"><span>Required</span><strong>${String(requiredOverrides[selected.id]??selected.required)}</strong></div></div><pre class="schema">${JSON.stringify(schema,null,2)}</pre></aside></section></main>`; document.getElementById('add').onclick=add; document.getElementById('up').onclick=moveUp; document.getElementById('clear').onclick=()=>{added=[];render();}; document.getElementById('req').onchange=e=>{requiredOverrides[selectedId]=e.target.checked;render();}; document.querySelectorAll('[data-field-id],[data-preview-field-id]').forEach(btn=>btn.onclick=()=>{selectedId=btn.getAttribute('data-field-id')||btn.getAttribute('data-preview-field-id');render();}); document.querySelectorAll('[aria-label$="sample value"]').forEach(input=>input.oninput=e=>{const id=input.getAttribute('aria-label').replace(' sample value','');values[id]=e.target.value;render();}); } render();
</script></body></html>
