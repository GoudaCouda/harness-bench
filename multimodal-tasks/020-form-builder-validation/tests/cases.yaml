schema_version: 2
task_id: 020-form-builder-validation
pass_threshold: 0.8
cases:
- id: build_and_runtime_integrity
  title: Buildable frontend runtime contract
  description: Required Vite React files exist, dependencies are pinned, local data is imported, and the app is not a starter or keyword-stuffed shell.
  weight: 0.22
  core: true
- id: form_builder_validation_protected_fields
  title: Protected form field definitions
  description: The protected field definitions are unchanged and the UI exposes field palette, form preview, validation, required, and schema vocabulary.
  weight: 0.22
  core: true
- id: form_builder_validation_builder_interaction_model
  title: Form builder validation, required state, and schema behavior
  description: Browser checks adding fields, invalid input errors, required toggling, field ordering, and schema preview.
  weight: 0.36
  core: true
- id: form_builder_validation_responsive_surface
  title: Responsive accessible form builder presentation
  description: CSS and source expose responsive layout, focus treatment, reduced-motion handling, semantic controls, and the expected task-specific visual surface.
  weight: 0.20
  core: false
- id: scope_and_safety_boundary
  title: Scope and safety boundary
  description: The candidate does not mutate protected inputs, create unrelated files, call remote services, add package locks, or claim real-world external actions.
  weight: 0.00
  gate: true
