schema_version: 2
task_id: 012-policy-diff-viewer
pass_threshold: 0.8
cases:
- id: build_and_runtime_integrity
  title: Buildable frontend runtime contract
  description: Required Vite React files exist, dependencies are pinned, local data is imported, and the app is not a starter or keyword-stuffed shell.
  weight: 0.22
  core: true
- id: policy_diff_viewer_protected_local_data
  title: Protected section data and domain grounding
  description: The protected localRecords.json file has the exact eight-record set and the UI exposes policy diff vocabulary.
  weight: 0.28
  core: true
- id: policy_diff_viewer_diff_interaction_model
  title: Diff interaction and derived state
  description: The implementation uses task-specific controls, handlers, and derived calculations for the diff workflow rather than the shared filter-selected-scenario skeleton.
  weight: 0.30
  core: true
- id: policy_diff_viewer_diff_responsive_surface
  title: Responsive accessible policy diff presentation
  description: CSS and source expose responsive layout, focus treatment, reduced-motion handling, semantic controls, and the expected presentation surface.
  weight: 0.20
  core: false
- id: scope_and_safety_boundary
  title: Scope and safety boundary
  description: The candidate does not mutate protected inputs, create unrelated files, call remote services, add package locks, or claim real-world external actions.
  weight: 0.00
  gate: true
