schema_version: 2
task_id: 014-accessibility-retrofit
pass_threshold: 0.8
cases:
- id: build_and_runtime_integrity
  title: Buildable frontend runtime contract
  description: Required Vite React files exist, dependencies are pinned, local data is imported, and the app is not a starter or keyword-stuffed shell.
  weight: 0.22
  core: true
- id: accessibility_retrofit_protected_assets
  title: Protected accessibility findings and target image
  description: The protected records and local audit target image are unchanged, and the UI is grounded in accessibility annotation vocabulary.
  weight: 0.22
  core: true
- id: accessibility_retrofit_annotation_interaction_model
  title: Screenshot annotation geometry and filtering behavior
  description: Browser checks marker coordinates relative to the image, marker selection, category filtering, remediation toggling, and summary changes.
  weight: 0.36
  core: true
- id: accessibility_retrofit_responsive_surface
  title: Responsive accessible annotation presentation
  description: CSS and source expose responsive layout, focus treatment, reduced-motion handling, semantic controls, and the expected annotation surface.
  weight: 0.20
  core: false
- id: scope_and_safety_boundary
  title: Scope and safety boundary
  description: The candidate does not mutate protected inputs, protected image assets, create unrelated files, call remote services, add package locks, or claim real-world external actions.
  weight: 0.00
  gate: true
