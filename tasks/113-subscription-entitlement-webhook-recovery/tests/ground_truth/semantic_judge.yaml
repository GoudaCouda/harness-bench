schema_version: 1
task_id: 113-subscription-entitlement-webhook-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Subscription-entitlement recovery handoff is professionally complete
  question: Does the handoff accurately explain both signed-snapshot gap bridges,
    duplicate and unknown-event handling, partial-refund seat preservation,
    recovered-payment restoration, lost-chargeback grace handling, period-end
    access preservation, interrupted SQLite recovery, receipt/replay verification,
    and the local-only no-provider/no-customer-action boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when every
    evidence relationship, lifecycle decision, verification result, and safety
    boundary is accurate and agrees with structured state.
  fail_anchors:
  - Omitting a gap, duplicate/quarantine decision, billing/entitlement exception,
    transaction recovery, replay result, or claiming a provider/customer action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
