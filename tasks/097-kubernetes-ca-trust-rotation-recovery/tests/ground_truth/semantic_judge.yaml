schema_version: 1
task_id: 097-kubernetes-ca-trust-rotation-recovery
criteria:
- id: handoff_semantics
  question: Does the handoff accurately explain the CA role fault, stale client, old-signed endpoint, legal recovery order, dual and new-only proof, rollback/monitoring, and offline boundary?
  title: Evidence-grounded CA-rotation recovery handoff
  description: The handoff accurately explains the bundle-role fault stale client old-signed endpoint legal recovery order complete dual proof protected retirement final new-only proof transient reconnect rollback boundary monitoring and offline-only scope.
  pass_if: Equivalent professional wording communicates all causal and safety relationships without contradicting the machine state.
  fail_if: It treats the bundle as a signing CA, omits the stale client or cp-3, claims retirement before dual proof, recommends rolling new signers backward, claims production execution, or contradicts final new-only verification.
