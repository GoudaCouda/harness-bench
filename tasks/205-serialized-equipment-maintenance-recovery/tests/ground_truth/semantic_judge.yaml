schema_version: 1
task_id: 205-serialized-equipment-maintenance-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Field-service recovery handoff is operationally complete
  question: Does the handoff accurately explain event-ID deduplication and sequence order, duplicate-work-order routing, effective BOM selection, technician/calibration/released-lot controls and distinct holds, interrupted-journal restoration, completed-work protection, allocation conservation, hash closure, semantic replay, and the no-dispatch/no-reservation/no-installation/no-permit-or-energization boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when all identity, control, recovery, conservation, replay, and safety relationships agree with structured state.
  fail_anchors:
  - Omitting a distinct hold, recovery or irreversible-boundary fact, or claiming an external action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
