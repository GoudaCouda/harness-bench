schema_version: 1
task_id: 123-entity-renewal-fallback-verification
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Vendor-renewal recovery handoff is professionally complete
  question: Does the handoff accurately explain rejection of the truncated export,
    signed-snapshot and correction version/effective-date authority, ready/owner-hold/
    expired-registration dispositions, minimum owner data, interrupted SQLite journal
    recovery, receipt/replay verification, and the no-activation/no-filing/no-outreach/
    no-payment/no-banking-data boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when every evidence
    relationship, disposition, recovery fact, and safety boundary is accurate and
    agrees with structured state.
  fail_anchors:
  - Omitting an authority decision, a distinct vendor disposition, journal recovery,
    replay result, minimization boundary, or claiming an external action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
