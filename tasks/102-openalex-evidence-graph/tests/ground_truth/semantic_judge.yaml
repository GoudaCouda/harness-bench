schema_version: 1
task_id: 102-openalex-evidence-graph
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: audit_semantics
  title: Evidence-graph recovery handoff is complete
  question: Does the audit accurately explain pagination and the row-count mismatch,
    DOI duplicate and non-duplicate version decisions, same-name and unknown-affiliation
    handling, suspected-DOI and unresolved-conflict quarantine, correction precedence,
    transitive review-required propagation, prior-checkpoint changes, dangling references,
    orphan authors, verification, and the offline no-external-action boundary?
  pass_anchors:
  - Equivalent prose and organization are acceptable when every decision is tied to local IDs.
  fail_anchors:
  - Inventing the missing page, merging people by display name, promoting a suspected DOI,
    suppressing conflict or dependency review, or claiming an external update fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
