global:
  resolve_timeout: 5m

route:
  receiver: operations-low
  group_by: [cluster, service, alertname]
  group_wait: 1s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: platform-page
      matchers:
        - severity="critical"
    - receiver: payments-low
      matchers:
        - service="payments"
        - severity="warning"

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [cluster, service, alertname]

receivers:
  - name: operations-low
    webhook_configs:
      - url: http://127.0.0.1:18083/operations-low
        send_resolved: true
  - name: payments-low
    webhook_configs:
      - url: http://127.0.0.1:18082/payments-low
        send_resolved: true
  - name: platform-page
    webhook_configs:
      - url: http://127.0.0.1:18081/platform-page
        send_resolved: true
