  score_group: validation_and_replay
- id: visible_cache_replay
  title: Protected replay artifacts match the repaired state machine
  description: State and event JSON are current parseable and independently reproducible.
  weight: 0.1
  core: true
  score_group: validation_and_replay
- id: verification_handoff
  title: Cache invariants and verification are handed off clearly
  description: Another engineer can understand expiry recency pinning transactional writes validation
    and checks.
  weight: 0.2
  core: false
- id: source_and_runtime_boundary
  title: Validation and offline task boundaries are respected
  description: Malformed inputs fail predictably, protected evidence remains unchanged, and no prohibited
    external action is claimed.
  weight: 0.15
  core: true
  score_group: validation_and_replay
