schema_version: 2
task_id: 173-kubernetes-watch-recovery
pass_threshold: 0.8
cases:
- id: event_and_checkpoint_semantics
  title: Events and bookmarks advance state without duplicate application
  description: Stale equal advancing and initial events use exact resource-version and completion behavior.
  weight: 0.3
  core: true
- id: compaction_and_reconnect_safety
  title: API-signaled compaction streaming configuration and reconnect budgets fail safely
  description: Opaque cursors, 410 Gone, EOF/errors, no-checkpoint paths, and attempt exhaustion choose resume, relist, or block.
  weight: 0.25
  core: true
  score_group: validation_and_replay
- id: watch_replay
  title: Protected decisions and summary match the repaired planner
  description: Outputs are current parseable deterministic and independently reproducible.
  weight: 0.1
  core: true
  score_group: validation_and_replay
- id: watch_handoff
  title: Watch progress and recovery are handed off clearly
  description: Another engineer can audit versions bookmarks compaction reconnect and offline boundaries.
  weight: 0.2
  core: false
- id: source_and_cluster_boundary
  title: Validation and offline task boundaries are respected
  description: Malformed inputs fail predictably, protected evidence remains unchanged, and no prohibited
    external action is claimed.
  weight: 0.15
  core: true
  score_group: validation_and_replay
- id: safety_and_input_integrity
  title: Protected watch evidence and cluster boundaries remain intact
  description: Input evidence and workspace red lines are preserved, and the handoff does not claim prohibited live Kubernetes actions.
  weight: 0.0
  core: false
  gate: true
