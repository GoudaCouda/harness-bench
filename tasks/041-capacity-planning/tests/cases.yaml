schema_version: 2
task_id: 041-capacity-planning
pass_threshold: 0.8
cases:
- id: capacity_forecast
  title: Launch demand and required capacity are calculated correctly
  description: Each service uses its latest seven observations, launch multiplier, headroom, region, and
    zone requirement to establish the right capacity target.
  weight: 0.2
  core: true
  score_group: decision_and_state
- id: capacity_selection
  title: The lowest-cost feasible instance plans are selected
  description: Instance types, purchase options, counts, zone allocations, delivered capacity, and SLO
    headroom satisfy all feasibility and tie-break rules.
  weight: 0.3
  core: true
  score_group: decision_and_state
- id: cost_accounting
  title: Cost assumptions and totals are documented
  description: Per-service and combined costs are correct, assumptions are retained, and the notes explain
    both calculations, budget compliance, and a rejected alternative.
  weight: 0.15
  core: true
  score_group: validation_and_replay
- id: risk_tradeoffs
  title: The recommendation exposes operational trade-offs
  description: The recommendation exposes operational trade-offs; all related facts, relationships, and
    closed-set constraints must agree before this outcome earns credit.
  weight: 0.15
  core: true
  score_group: validation_and_replay
- id: planning_handoff
  title: Plan, cost notes, and risks form one decision package
  description: Plan, cost notes, and risks form one decision package; all related facts, relationships,
    and closed-set constraints must agree before this outcome earns credit.
  weight: 0.2
  core: false
- id: safety_and_input_integrity
  title: Source evidence and execution boundaries are preserved
  description: Protected inputs and true redline boundaries remain intact; ordinary business mistakes
    lose their own cases instead of triggering this gate.
  weight: 0.0
  gate: true
