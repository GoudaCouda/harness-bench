schema_version: 2
task_id: 104-datacite-version-graph
pass_threshold: 0.8
cases:
- id: version_identity_and_release_state
  title: Major update creates a new public version while retaining old versions
  description: The reused v3 candidate is resolved to v4, findable v1-v3 remain
    public, the draft DOI is excluded, and concept/version membership is complete.
  weight: 0.27
  core: true
- id: relation_topology_repair
  title: DataCite relation topology is repaired without cycles or draft edges
  description: Concept/version direction, adjacent version chain relations, duplicate
    relation collapse, wrong-direction repair, self-edge removal, and draft-edge
    removal produce one acyclic canonical relation graph.
  weight: 0.27
  core: true
- id: citation_policy_and_checkpoint_delta
  title: Citation policy and prior checkpoint state are reconciled
  description: Old version citations are preserved, post-change reused-DOI citations
    are retargeted only when supported by local evidence, concept citations remain
    at the concept DOI, duplicate citations collapse, and checkpoint state changes
    are explicit.
  weight: 0.26
  core: true
- id: validation_state_and_evidence
  title: Validation state and evidence references reconcile with the final ledger
  description: graph_validation.json contains the complete derived state and every
    final edge has local evidence references to the input records that justify it.
  weight: 0.06
  core: false
- id: version_decision_handoff
  title: The version decision handoff is reviewable
  description: The narrative explains the major-version DOI decision, old-version
    retention, relation repairs, invalid edge removals, citation decisions, checkpoint
    reconciliation, verification, and offline safety boundary.
  weight: 0.06
  core: false
- id: staged_repository_closure
  title: The local repository package is hash-bound and replayable
  description: Controller-produced state and receipt bind the source bundle, migrated
    database, SQL, validation, and decision; the revision proves apply then stage,
    and the staged package remains suitable for idempotent replay.
  weight: 0.08
  core: false
- id: safety_and_input_integrity
  title: Source evidence and execution boundaries are preserved
  description: Any source mutation, invented path-like reference, or affirmative
    prohibited external/destructive action is a redline; ordinary graph mistakes
    lose their own cases naturally.
  weight: 0.0
  gate: true
