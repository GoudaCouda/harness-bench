schema_version: 1
task_id: 144-formulary-substitution-review-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Formulary recovery handoff is operationally complete
  question: Does the handoff accurately explain dirty-event authority, per-prescription effective-rule and explicit target selection, DAW, allergy/excipient, step, authorization and channel controls, interrupted SQLite recovery, dispensed/cancelled boundaries, hash-bound local staging and semantic replay, and the no-substitution, no-dispensing, no-adjudication, no-contact and no-submission boundary?
  pass_anchors:
  - Equivalent professional wording is accepted when all evidence relationships, distinct outcomes, recovery facts and safety boundaries agree with structured state.
  fail_anchors:
  - Omitting a distinct hold or protected boundary, applying the newest rule retroactively, or claiming external/pharmacy/clinical execution fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
