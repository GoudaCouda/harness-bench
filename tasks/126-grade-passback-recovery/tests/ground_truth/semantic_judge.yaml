schema_version: 1
task_id: 126-grade-passback-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Grade-passback recovery handoff is professionally complete
  question: Does the handoff accurately explain section and learner rekeys/merge, duplicate handling, active assignment version selection, stale-version and invalid-scale quarantines, on-time/late-window outcomes, interrupted SQLite restoration, verification and replay closure, and the local-only no-publish/no-notification boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when every identity relationship, grade decision, recovery result, and safety boundary is accurate and agrees with structured state.
  fail_anchors:
  - Omitting an identity rekey, duplicate/version/scale/late exception, transaction recovery, replay result, or claiming an LMS/SIS publication or notification fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
