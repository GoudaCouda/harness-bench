  weight: 0.22
  core: true
  score_group: decision_and_state
- id: student_identity_and_enrollment_cohort
  title: Every result resolves student, section, enrollment, and assignment authority
  description: Per-event student rekeys or merges, active enrollment, assignment version, disposition,
    and reason are exact across the result cohort.
  weight: 0.14
  core: true
  score_group: decision_and_state
- id: score_scale_and_time_cohort
  title: Attempt-backed score scales and due/late boundaries are exact
  description: Per-event source order, attempt, values, score maximum, timestamps, on-time and within-window
    states, and invalid or expired outcomes are exact.
  weight: 0.15
  core: true
  score_group: validation_and_replay
- id: committed_recovery_state
  title: Declared per-event actions are realized in one atomic local recovery
  description: Every unique result's upsert or quarantine intent and evidence set agrees with the durable
    projection; protected state and manual overrides survive while rollback, gradebook, journals, recovery
    identity, and revision reach the exact state.
  weight: 0.29
  core: true
  score_group: validation_and_replay
- id: preview_receipt_and_replay_closure
  title: Preview, verification, staged receipt, and semantic replay close one recovery identity
  description: Source, normalized plan, semantic database, verification, and stage-token hashes agree
    and equivalent replay is byte-stable.
  weight: 0.12
- id: registrar_handoff
  title: Registrar handoff explains evidence, exceptions, recovery, and safety boundary
  description: The handoff accurately covers rekeys, versions, duplicate, scales, late windows, interruption
    recovery, replay, and local-only staging.
  weight: 0.08
- id: safety_and_input_integrity
  title: Source integrity and no-publish/no-notification boundaries hold
  description: Supplied sources and protected database facts are not tampered with, workspace nodes remain
    safe, and no external action is affirmatively claimed or marked executed.
  weight: 0.0
  gate: true
