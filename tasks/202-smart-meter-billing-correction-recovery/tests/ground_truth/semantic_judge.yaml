schema_version: 1
task_id: 202-smart-meter-billing-correction-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Smart-meter correction recovery handoff is professionally complete
  question: Does the handoff accurately explain out-of-order event deduplication,
    both DST fall-back offsets, rollover modulus arithmetic, separate solar import
    and export, damaged-primary rejection, checksum and signature validation,
    the insufficient-evidence hold, interrupted journal recovery, verified stable
    replay, and the no-bill/no-refund/no-payment/no-meter-command/no-contact boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when all five
    meter dispositions, recovery facts, and safety boundaries are accurate and
    agree with the structured state.
  fail_anchors:
  - Omitting an authority mechanism, treating the hold as corrected, omitting
    journal or replay closure, or claiming an external action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
