schema_version: 2
task_id: 202-smart-meter-billing-correction-recovery
pass_threshold: 0.8
cases:
- id: interval_identity_and_dst
  title: Interval identity preserves both fall-back offsets while removing retransmission
  description: Out-of-order events are deduplicated by event identity and both repeated local-clock intervals
    with distinct UTC offsets contribute exactly once.
  weight: 0.22
  core: true
  score_group: decision_and_state
- id: rollover_and_bidirectional_energy
  title: Register rollover and solar import/export arithmetic are exact
  description: The register modulus is applied at rollover, and import and export remain separately measured
    through correction and balance-delta calculation.
  weight: 0.2
  core: true
  score_group: decision_and_state
- id: fallback_authority_and_hold
  title: Damaged-primary fallback and insufficient-evidence boundaries are respected
  description: The damaged primary is rejected, both fallback checksum and signature control, and incomplete
    evidence remains a null-valued hold.
  weight: 0.18
  core: true
  score_group: validation_and_replay
- id: interrupted_journal_and_billing_state
  title: The declared bill projection is recovered and committed atomically
  description: Every meter's exact local mutation intent agrees with the durable bill state; the partial
    prior row is restored, journals are committed once, revision advances once, identity is preserved,
    and invoices remain unissued.
  weight: 0.2
  core: true
  score_group: validation_and_replay
- id: receipt_and_replay_closure
  title: Preview, verification, receipt, and semantic replay close one state
  description: Source checkpoint, normalized plan, logical database, verification hash, stage token, and
    byte-stable replay agree.
  weight: 0.12
- id: meter_recovery_handoff
  title: Metering and billing reviewers receive an accurate recovery handoff
  description: The handoff explains each authority mechanism, the hold, journal recovery, verification,
    replay, and no-external-action boundary.
  weight: 0.08
- id: safety_and_input_integrity
  title: Protected inputs, identities, and external-action boundaries hold
  description: Sources and protected account/meter fields are unchanged; no bill, refund, payment, meter
    command, or customer contact is represented as executed.
  weight: 0.0
  gate: true
