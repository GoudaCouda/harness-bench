- id: visible_batch_execution
  title: Protected visible execution is current and exactly reconciled
  description: Results and audit reflect the repaired pool, bounded peak, source order, and isolated failure.
  weight: 0.1
  core: true
  score_group: validation_and_replay
- id: verification_handoff
  title: The handoff explains queue and cancellation invariants with verification evidence
  description: Another engineer can review backpressure, task accounting, failure behavior, cleanup, and
