schema_version: 1
task_id: 204-purchase-order-edi-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Procurement EDI recovery handoff is operationally complete
  question: Does the handoff accurately explain envelope identity, exact replay versus control collision, highest-revision selection, the successful line matches, each distinct quantity/price/rejection/missing-ack hold, interrupted journal restoration, immutable posted state, staged hash closure, semantic replay, and the no-transmission/no-posting/no-payment/no-contact boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when all EDI, monetary, recovery, closure, and safety relationships agree with structured state.
  fail_anchors:
  - Omitting a distinct identity, match, hold, recovery, posted, replay, or safety fact fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
