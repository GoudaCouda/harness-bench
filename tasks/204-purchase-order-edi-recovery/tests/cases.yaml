  core: true
  score_group: decision_and_state
- id: ready_payable_line_matches
  title: Ready-payable orders have exact line authority and amounts
  description: Successful 850/855/856/810 joins, quantities, prices, evidence, actions, and matched amounts
    agree for locally ready orders.
  weight: 0.15
  core: true
  score_group: decision_and_state
- id: held_orders_posted_and_totals
  title: Held orders, posted decision, and portfolio totals reconcile
  description: Distinct hold reasons and amounts remain exact while the posted decision and aggregate
