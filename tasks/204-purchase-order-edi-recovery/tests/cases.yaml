  weight: 0.17
  core: true
  score_group: decision_and_state
- id: receipt_match_journal_and_recovery_projection
  title: Receipt, match, journal, and recovery tables reconcile
  description: EDI receipt and line-match rows project the plan, the before-image journal is restored,
    and one recovery run binds the local state.
  weight: 0.17
  core: true
  score_group: validation_and_replay
- id: plan_identity_order_projection_and_posted_boundary
  title: Plan identity, order projection, and posted boundary remain exact
  description: Schema, recovery ID, checkpoint, local-only flag, PO/line state, system revision, protected
