schema_version: 1
task_id: 132-itinerary-replan-after-second-disruption
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: The itinerary recovery handoff is professionally complete
  question: Does the handoff accurately explain signed/valid inventory, out-of-order duplicate-event handling, every rejected or dominated option, timezone/connection/curfew/shuttle/visa/bag/accessibility constraints, the minimum-change-then-cost selection, preserved and changed objects, interrupted SQLite recovery, local staging and replay, and the no-external-action boundary?
  pass_anchors:
  - Equivalent professional wording and organization pass when every controlling relationship and boundary is accurate and agrees with structured state.
  fail_anchors:
  - Omitting a materially distinct option rationale, traveler or timing constraint, recovery/replay fact, object delta, or claiming a live booking/refund/message fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
