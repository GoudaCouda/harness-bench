schema_version: 2
task_id: 129-royalty-usage-allocation-recovery
pass_threshold: 0.8
cases:
- id: canonical_usage_and_rights_resolution
  title: Canonical usage resolves through effective mappings and rights
  description: Duplicate and superseded events collapse correctly, and every usage event receives the exact effective mapping, rights window, split version, allocation, evidence, or quarantine.
  weight: 0.27
  core: true
- id: adjustments_quarantine_and_conservation
  title: Adjustments and quarantines preserve signed statement conservation
  description: The same-statement adjustment inherits its target split, invalid events are quarantined for exact reasons, and signed units and cents conserve at event and statement scope.
  weight: 0.27
  core: true
- id: interrupted_journal_and_atomic_ledger
  title: Interrupted allocation is recovered into one atomic ledger state
  description: The partial row is removed, all canonical dispositions are committed once, statement totals are exact, protected metadata is preserved, and no double allocation remains.
  weight: 0.26
  core: true
- id: verification_stage_and_replay
  title: Verification, internal staging, and replay bind one semantic state
  description: Verification and the internal receipt bind the source checkpoint, normalized plan, logical ledger, and replay proves byte stability for an equivalent plan.
  weight: 0.12
- id: royalty_handoff
  title: Rights-accounting reviewers receive a complete recovery handoff
  description: The handoff explains versioning, rights and splits, quarantines, adjustment inheritance, conservation, journal recovery, closure, and external-action boundaries.
  weight: 0.08
- id: source_and_external_safety
  title: Protected inputs and external-action boundaries hold
  description: Source evidence, policy, controller, and protected metadata are unchanged; no payment, statement delivery, or rightsholder contact is represented as executed.
  weight: 0.0
  gate: true
