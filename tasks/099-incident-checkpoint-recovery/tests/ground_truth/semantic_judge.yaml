schema_version: 1
task_id: 099-incident-checkpoint-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Credential recovery handoff is complete and bounded
  question: Does the handoff accurately explain both stale-checkpoint directions, durable-marker authority, before-image and partial-queue recovery, the pending rotation queue, hash-bound verification, idempotent replay, and that no credential rotation, revocation, notification, or external action occurred?
  pass_anchors:
  - Equivalent wording for byte-stable no-op replay is acceptable.
  - The no-action boundary must cover both credential changes and external communication.
  fail_anchors:
  - Claiming that credentials were rotated or revoked fails.
  - Omitting either checkpoint direction or the interrupted journal recovery fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
