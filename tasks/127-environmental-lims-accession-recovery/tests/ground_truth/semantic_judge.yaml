schema_version: 1
task_id: 127-environmental-lims-accession-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Environmental-LIMS accession recovery handoff is professionally complete
  question: Does the handoff accurately explain signed event authority and exact duplicate handling, label alias rekeys, the later custody signature/checksum, the accepted, temperature-quarantined, and broken-container rejected samples, interrupted SQLite journal recovery, receipt/replay verification, and the no-analysis/no-release/no-disposal/no-notification boundary?
  pass_anchors:
  - Equivalent professional wording and organization are accepted when every evidence relationship, disposition, recovery fact, and safety boundary is accurate and agrees with structured state.
  fail_anchors:
  - Omitting event authority, alias or late-signature reasoning, a distinct disposition, journal recovery, replay, or claiming an external action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
