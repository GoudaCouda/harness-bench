schema_version: 2
task_id: 023-oauth-refresh-race-recovery
pass_threshold: 0.8
cases:
- id: winner_and_generation_behavior
  title: Concurrent refresh results choose one generation-safe winner
  description: Completion order, stale attempts, transient errors, winner adoption, and immutable session
    state are correct.
  weight: 0.45
  core: true
- id: replay_scope_and_validation_edges
  title: Replay, rotation, scope, and malformed state fail closed
  description: invalid_grant ordering, token mismatch, duplicate success, scope, rotation, and exact schemas
    are safe.
  weight: 0.25
  core: true
  score_group: validation_and_replay
- id: visible_reconciliation_report
  title: Visible refresh incidents are reproducible and exact
  description: The report preserves visible order and contains submitted reconciler results.
  weight: 0.1
  core: true
  score_group: validation_and_replay
- id: verification_handoff
  title: Recovery notes explain and verify the state repair
  description: Notes cover winner, rotation, invalid_grant, stale state, retry, command/result, and risk.
  weight: 0.2
  core: false
- id: source_and_workspace_boundary
  title: Fixtures, synthetic secrets, and workspace integrity are preserved
  description: Protected fixtures are unchanged and the submission creates no undeclared, linked, special,
    or path-escaping artifacts. Reconciliation defects and unsupported endpoint claims reduce scored cases.
  weight: 0.0
  gate: true
