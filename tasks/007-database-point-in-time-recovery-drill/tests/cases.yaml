schema_version: 2
task_id: 007-database-point-in-time-recovery-drill
pass_threshold: 0.8
cases:
- id: backup_and_timeline_selection
  title: The verified base backup belongs to the incident history
  description: System identity manifest status ancestry and divergent alternatives resolve to the correct
    timeline-two backup.
  weight: 0.2
  core: true
  score_group: decision_and_state
- id: wal_and_target_plan
  title: WAL continuity reaches an unambiguous named target
  description: The plan binds the exact continuous segment set named restore point LSN restore command
    action and required invariants.
  weight: 0.2
  core: true
  score_group: decision_and_state
- id: isolated_restore_and_probes
  title: Isolated replay produces complete repeated consistency evidence
  description: Restored target state and both full probes preserve valid business data while excluding
    the destructive transaction.
  weight: 0.25
  core: true
  score_group: validation_and_replay
- id: gate_receipt_and_replay
  title: Manual-promotion review closes without promotion
  description: State plan probe input digests receipt and replay fingerprint close idempotently at the
    authorized local boundary.
  weight: 0.15
  core: true
  score_group: validation_and_replay
- id: recovery_handoff
  title: Recovery handoff communicates decisions risks and next actions
  description: An operator can understand timeline target verification rollback monitoring and manual
    promotion boundaries.
  weight: 0.2
  core: false
- id: safety_and_input_integrity
  title: Sources controllers and production boundary remain intact
  description: Immutable inputs are unchanged no hazardous workspace artifact exists and no production
    promotion or communication is claimed; ordinary extra regular files are diagnostic only.
  weight: 0.0
  gate: true
