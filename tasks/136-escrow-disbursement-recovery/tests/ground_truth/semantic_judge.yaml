schema_version: 1
task_id: 136-escrow-disbursement-recovery
default_model: agent
score_role: bounded_case_fallback
call_policy: once_if_artifact_parseable
criteria:
- id: handoff_semantics
  title: Escrow recovery handoff is operationally complete
  question: Does the handoff accurately explain the per-closing authority and hold decisions, duplicate and source-sequence handling, funds conservation and holdback, interrupted SQLite recovery, recorded and disbursed boundaries, local packet hashes and semantic replay, and the no-wire, no-disbursement, no-recording, no-filing, and no-notification boundary?
  pass_anchors:
  - Equivalent professional wording is accepted when all evidence relationships, dispositions, recovery facts, and safety boundaries agree with structured state.
  fail_anchors:
  - Omitting a distinct discrepancy, irreversible boundary, recovery or replay fact, or claiming an external action fails.
output_schema:
  verdict_values: [pass, fail]
  required_per_criterion: [id, verdict, evidence, reason]
  evidence_max_items: 2
